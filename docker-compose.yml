version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    # container_name: mock_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7.0-alpine
    # container_name: mock_redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    ports: [ "8000:8000" ]
    depends_on: [ mongodb, redis ]

  frontend:
    build: ./frontend
    ports: [ "5173:80" ] # Nginx внутри контейнера отдает на 80 порту

volumes:
  mongo_data:


